stages:
  - checks
  - test
  - build
  - package

default:
  image: node:20-alpine
  before_script:
    - npm ci

variables:
  NODE_ENV: production
  DATABASE_URL: "postgresql://build:build@localhost:5432/task_manager?schema=public"
  AUTH_SECRET: "build-only-secret"
  APPLICATION_SECRET: "build-only-secret"

checks:
  stage: checks
  script:
    - npm run typecheck
    - npm run lint

unit-tests:
  stage: test
  script:
    - npm run test:unit

build:
  stage: build
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - .next/

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script: []
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker build --provenance=false -t "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
